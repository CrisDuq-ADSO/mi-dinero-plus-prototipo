<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Deudas – Mi Dinero+</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .debts-layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 1.5rem;
      align-items: start;
    }

    /* === Solo el encabezado "Registrar Deuda" en rojo === */
    .registrar-deuda-header {
      background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
      color: white;
      padding: 0.85rem 1.25rem;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    .registrar-deuda-header h3 {
      color: white !important;
      font-size: 1rem;
      font-weight: 700;
      margin: 0;
    }

    .total-debt-card {
      background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
      color: white;
      border-radius: var(--radius-lg);
      padding: 1.35rem 1.5rem;
      margin-bottom: 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .total-debt-card .label {
      font-size: 0.85rem;
      opacity: 0.9;
      font-weight: 500;
    }
    .total-debt-card .value {
      font-size: 1.60rem;
      font-weight: 700;
      line-height: 1.1;
    }

    .debt-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      margin-bottom: 1rem;
      transition: box-shadow 0.2s;
    }
    .debt-card:hover {
      box-shadow: var(--shadow);
    }
    .debt-card.paid {
      border-color: var(--success);
      background: linear-gradient(to right, rgba(16,185,129,0.04), transparent);
    }

    .debt-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.9rem;
    }
    .debt-name {
      font-weight: 700;
      font-size: 1.05rem;
      margin-bottom: 0.35rem;
    }
    .debt-meta {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }
    .debt-delete {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      opacity: 0.4;
      transition: opacity 0.15s;
      padding: 0.2rem;
    }
    .debt-delete:hover { opacity: 1; }

    .debt-amounts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
    }
    .debt-amount-item .label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 0.15rem;
    }
    .debt-amount-item .value {
      font-weight: 700;
      font-size: 1.05rem;
    }

    .debt-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.75rem;
      flex-wrap: wrap;
    }

    .paid-badge {
      text-align: center;
      background: #D1FAE5;
      color: #065F46;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 0.5rem;
      border-radius: var(--radius);
      margin-top: 0.5rem;
    }
    [data-theme="dark"] .paid-badge {
      background: #064E3B;
      color: #43a57e;
    }

    @media (max-width: 900px) {
      .debts-layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body data-page="deudas">

  <!-- Banner educativo -->
  <div class="edu-banner">
    ⚠️ Entorno de Simulación Educativa – No se utiliza dinero real
    <button class="close-banner" aria-label="Cerrar">×</button>
  </div>

  <!-- Navbar -->
  <header class="navbar" id="navbar"></header>

  <main class="main-content">
    <div class="container">

      <!-- Asistente IA -->
      <div class="ai-assistant" id="aiAssistant" 
           style="background: rgba(239, 68, 68, 0.12); 
                  border: 1px solid rgba(239, 68, 68, 0.25); 
                  color: var(--text-primary);">
      </div>

      <div class="debts-layout">

        <!-- Registrar Deuda -->
        <div class="card">
          <!-- Solo el encabezado en rojo -->
          <div class="registrar-deuda-header">
            <h3>Registrar Deuda</h3>
          </div>
          
          <div class="card-body">
            <form id="debtForm" novalidate>
              <div class="form-group">
                <label class="form-label" for="debtName">Nombre / Entidad</label>
                <input type="text" id="debtName" class="form-control" placeholder="Ej. Tarjeta de Crédito">
              </div>

              <div class="form-group">
                <label class="form-label" for="debtTotal">Monto Total ($)</label>
                <input type="number" id="debtTotal" class="form-control" placeholder="0" min="1" step="1">
              </div>

              <div class="form-group">
                <label class="form-label" for="debtRemaining">Saldo Pendiente ($)</label>
                <input type="number" id="debtRemaining" class="form-control" placeholder="0" min="0" step="1">
              </div>

              <div class="form-group">
                <label class="form-label" for="debtDueDate">Fecha de Vencimiento</label>
                <input type="date" id="debtDueDate" class="form-control">
              </div>

              <div class="form-group">
                <label class="form-label" for="debtInterest">Tasa de Interés Anual (%)</label>
                <input type="number" id="debtInterest" class="form-control" placeholder="Ej. 2.5" min="0" step="0.1">
              </div>

              <!-- Botón rojo -->
              <button type="submit" class="btn btn-primary btn-block" style="background: var(--danger);">
                + Guardar Deuda
              </button>
            </form>
          </div>
        </div>

        <!-- Lista de deudas -->
        <div>
          <div class="total-debt-card">
            <div>
              <div class="label">Deuda Total Pendiente</div>
              <div style="font-size:0.85rem;opacity:0.85;margin-top:0.15rem">Suma de saldos activos</div>
            </div>
            <div class="value" id="deudaTotal">$ 0</div>
          </div>

          <div class="card">
            <div class="card-header">
              <h3 style="font-size:1rem;"> Tus Deudas Activas</h3>
            </div>
            <div class="card-body" id="debtsList">
              <!-- Se llena con JS -->
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/animations.js"></script>
  <script src="../assets/js/debts.js"></script>
</body>
</html>

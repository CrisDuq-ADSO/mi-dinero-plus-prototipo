<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transacciones – Mi Dinero+</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .type-switch {
      display: flex;
      background: var(--bg-body);
      border-radius: var(--radius);
      padding: 4px;
      margin-bottom: 1.25rem;
    }
    .type-btn {
      flex: 1;
      padding: 0.6rem;
      border: none;
      background: transparent;
      border-radius: calc(var(--radius) - 2px);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.2s ease;
    }
    .type-btn.active {
      background: var(--bg-card);
      box-shadow: var(--shadow-sm);
    }

    .type-btn[data-type="gasto"].active {
      color: #EF4444; /* Rojo */
      font-weight: 700;
    }
    .type-btn[data-type="ingreso"].active {
      color: #10B981; /* Verde */
      font-weight: 700;
    }

    .tx-layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 1.5rem;
      align-items: start;
    }

    .balance-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .balance-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.1rem;
      text-align: center;
      transition: all 0.3s ease;
    }
    .balance-card .label {
      font-size: 0.78rem;
      color: var(--text-secondary);
      font-weight: 500;
      margin-bottom: 0.35rem;
    }
    .balance-card .value {
      font-size: 1.35rem;
      font-weight: 700;
    }

    .balance-card.ingresos {
      background: rgba(16, 185, 129, 0.1);
      border-color: rgba(16, 185, 129, 0.25);
    }
    .balance-card.ingresos .value { color: #10B981; }

    .balance-card.gastos {
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.25);
    }
    .balance-card.gastos .value { color: #EF4444; }

    .balance-card.balance {
      background: rgba(29, 78, 216, 0.12);
      border-color: rgba(29, 78, 216, 0.3);
    }
    .balance-card.balance .value { color: #3B82F6; }

    .tx-item {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0.9rem 0;
      border-bottom: 1px solid var(--border);
    }
    .tx-item:last-child { border-bottom: none; }

    .tx-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .tx-icon.ingreso { background: #D1FAE5; color: #065F46; }
    .tx-icon.gasto { background: #FEE2E2; color: #991B1B; }

    .tx-info { flex: 1; min-width: 0; }
    .tx-desc { font-weight: 600; font-size: 0.95rem; }
    .tx-meta { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.15rem; }
    .tx-amount { font-weight: 700; font-size: 0.95rem; white-space: nowrap; }
    .tx-amount.ingreso { color: var(--success); }
    .tx-amount.gasto { color: var(--danger); }

    .tx-delete {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      opacity: 0.45;
      transition: opacity 0.15s;
    }
    .tx-delete:hover { opacity: 1; }

    @media (max-width: 900px) {
      .tx-layout { grid-template-columns: 1fr; }
      .balance-cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body data-page="transacciones">

  <!-- Banner educativo -->
  <div class="edu-banner">
    ⚠️ Entorno de Simulación Educativa – No se utiliza dinero real
    <button class="close-banner" aria-label="Cerrar">×</button>
  </div>

  <!-- Navbar -->
  <header class="navbar" id="navbar"></header>

  <main class="main-content">
    <div class="container">

      <!-- Asistente IA -->
      <div class="ai-assistant" id="aiAssistant" 
           style="background: rgba(29, 78, 216, 0.12); 
                  border: 1px solid rgba(29, 78, 216, 0.25); 
                  color: var(--text-primary);">
      </div>

      <div class="tx-layout">

        <!-- Formulario Nueva Transacción -->
        <div class="card">
          <div class="card-header" style="background: #1D4ED8; color: white; border-bottom: none;">
            <h3 style="font-size:1rem; color: white;"> Nueva Transacción</h3>
          </div>
          <div class="card-body">
            <form id="txForm" novalidate>
              <!-- Toggle Gasto / Ingreso -->
              <div class="type-switch">
                <button type="button" class="type-btn active" data-type="gasto">Gasto</button>
                <button type="button" class="type-btn" data-type="ingreso">Ingreso</button>
              </div>

              <div class="form-group">
                <label class="form-label" for="txAmount">Monto ($)</label>
                <input type="number" id="txAmount" class="form-control" placeholder="0" min="1" step="1">
              </div>

              <div class="form-group">
                <label class="form-label" for="txDate">Fecha</label>
                <input type="date" id="txDate" class="form-control" placeholder="dd/mm/aaaa">
              </div>

              <div class="form-group">
                <label class="form-label" for="txCategory">Categoría</label>
                <select id="txCategory" class="form-control">
                  <option value="">Seleccionar...</option>
                </select>
              </div>

              <div class="form-group">
                <label class="form-label" for="txDescription">Descripción</label>
                <input type="text" id="txDescription" class="form-control" placeholder="Ej. Compra supermercado">
              </div>

              <!-- Botón azul -->
              <button type="submit" id="txSubmit" class="btn btn-primary btn-block" 
                      style="background: #1D4ED8; color: white;">
                Registrar Gasto
              </button>
            </form>
          </div>
        </div>

        <!-- Panel derecho -->
        <div>
          <div class="balance-cards">
            <div class="balance-card ingresos">
              <div class="label">TOTAL INGRESOS</div>
              <div class="value" id="totalIngresos">$ 0</div>
            </div>

            <div class="balance-card gastos">
              <div class="label">TOTAL GASTOS</div>
              <div class="value" id="totalGastos">$ 0</div>
            </div>

            <div class="balance-card balance">
              <div class="label">BALANCE NETO</div>
              <div class="value" id="balanceNeto">$ 0</div>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <h3 style="font-size:1rem;"> Historial de Movimientos</h3>
            </div>
            <div class="card-body" id="txHistory"></div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/animations.js"></script>
  <script src="../assets/js/transactions.js"></script>
</body>
</html>
